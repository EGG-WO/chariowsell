<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Channel+ — Accès Premium</title>

<style>

* {
  box-sizing:border-box;
}

html,
body {
  margin:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#050816;
  color:#fff;
}

body {
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box {

  width:min(92%,420px);

  background:
    linear-gradient(
      145deg,
      rgba(17,24,39,.98),
      rgba(15,23,42,.98)
    );

  padding:32px;

  border-radius:24px;

  text-align:center;

  border:1px solid rgba(255,255,255,.08);

  box-shadow:
    0 20px 70px rgba(0,0,0,.6),
    0 0 50px rgba(34,211,238,.08);
}

.logo {

  font-size:30px;

  font-weight:800;

  margin-bottom:8px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #22d3ee,
      #2563eb
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.sub {

  color:#94a3b8;

  line-height:1.5;

  margin:0 0 25px;
}

.icon {

  font-size:55px;

  margin-bottom:10px;
}

h2 {

  margin:0 0 10px;

}

input {

  width:100%;

  padding:16px;

  margin-top:12px;

  border-radius:14px;

  border:1px solid rgba(255,255,255,.1);

  background:#0b1220;

  color:#fff;

  font-size:17px;

  text-align:center;

  outline:none;

  text-transform:uppercase;
}

input:focus {

  border-color:#22d3ee;

  box-shadow:
    0 0 20px rgba(34,211,238,.15);
}

button {

  width:100%;

  padding:15px;

  margin-top:14px;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #22d3ee,
      #2563eb
    );

  color:#fff;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

}

button:hover {

  filter:brightness(1.08);

  transform:translateY(-1px);

}

button:disabled {

  opacity:.6;

  cursor:not-allowed;

  transform:none;

}

.info {

  margin-top:20px;

  padding:14px;

  border-radius:14px;

  background:rgba(34,211,238,.06);

  border:1px solid rgba(34,211,238,.12);

  color:#94a3b8;

  font-size:13px;

  line-height:1.5;

}

#message {

  min-height:24px;

  margin-top:18px;

  line-height:1.5;

  font-weight:bold;
}

.success {
  color:#22c55e;
}

.error {
  color:#ef4444;
}

.loading {

  display:none;

  position:fixed;

  inset:0;

  z-index:999999;

  background:#050816;

  align-items:center;

  justify-content:center;

  text-align:center;
}

.loadingBox {

  background:#111827;

  padding:30px;

  border-radius:20px;

  border:1px solid rgba(255,255,255,.08);
}

.spinner {

  width:45px;

  height:45px;

  margin:0 auto 18px;

  border:4px solid rgba(255,255,255,.1);

  border-top-color:#22d3ee;

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin {

  to {
    transform:rotate(360deg);
  }

}

</style>

</head>


<body>


<div class="box">

  <div class="logo">
    CHANNEL+ PREMIUM
  </div>

  <p class="sub">
    Accès sécurisé à votre abonnement
  </p>


  <div class="icon">
    🎫
  </div>


  <h2>
    Entrez votre ticket
  </h2>


  <p class="sub">

    Entrez le code reçu lors de votre achat
    pour accéder à Channel+ Premium.

  </p>


  <input
    id="ticketInput"
    type="text"
    autocomplete="off"
    maxlength="50"
    placeholder="ABCD-1234-EFGH">


  <button
    id="verifyButton">

    🔐 Vérifier mon ticket

  </button>


  <div class="info">

    🔒 Aucun compte Google n'est nécessaire.

    <br><br>

    Votre accès est sécurisé automatiquement
    par Firebase.

  </div>


  <div id="message"></div>

</div>


<div
  id="loading"
  class="loading">

  <div class="loadingBox">

    <div class="spinner"></div>

    <div id="loadingText">
      Vérification...
    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  runTransaction,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// =====================================================
// FIREBASE
// =====================================================

const firebaseConfig = {

  apiKey:
    "AIzaSyDPh3dJ37au21L70Mekm_ikuIfeD8wCZU",

  authDomain:
    "channelplus-8c219.firebaseapp.com",

  databaseURL:
    "https://channelplus-8c219-default-rtdb.firebaseio.com",

  projectId:
    "channelplus-8c219",

  storageBucket:
    "channelplus-8c219.firebasestorage.app",

  messagingSenderId:
    "178858225057",

  appId:
    "1:178858225057:web:63c327bf23eb877f196fe0"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


// =====================================================
// ÉLÉMENTS
// =====================================================

const ticketInput =
  document.getElementById(
    "ticketInput"
  );


const verifyButton =
  document.getElementById(
    "verifyButton"
  );


const message =
  document.getElementById(
    "message"
  );


const loading =
  document.getElementById(
    "loading"
  );


const loadingText =
  document.getElementById(
    "loadingText"
  );


// =====================================================
// PAGE MULTICHAÎNE
// =====================================================

const SITE_MULTICHAINE =
  "./site-multichaine-securise.html";


// =====================================================
// SESSION
// =====================================================

const SESSION_KEY =
  "channelplus_access_v2";


// =====================================================
// UTILISATEUR FIREBASE
// =====================================================

let currentUser = null;


// =====================================================
// AFFICHAGE MESSAGE
// =====================================================

function showMessage(
  text,
  type
) {

  message.textContent =
    text;

  message.className =
    type || "";

}


// =====================================================
// LOADING
// =====================================================

function showLoading(text) {

  loadingText.textContent =
    text;

  loading.style.display =
    "flex";

}


function hideLoading() {

  loading.style.display =
    "none";

}


// =====================================================
// AUTHENTIFICATION ANONYME
// =====================================================

async function connectFirebase() {

  try {

    if (auth.currentUser) {

      currentUser =
        auth.currentUser;

      return true;

    }


    const result =
      await signInAnonymously(auth);


    if (!result.user) {

      throw new Error(
        "AUTH_FAILED"
      );

    }


    currentUser =
      result.user;

    return true;

  }

  catch(error) {

    console.error(
      "Erreur authentification Firebase:",
      error
    );

    return false;

  }

}


// =====================================================
// VÉRIFIER SI UNE SESSION EXISTE
// =====================================================

function getSavedAccess() {

  try {

    const saved =
      sessionStorage.getItem(
        SESSION_KEY
      );


    if (!saved) {

      return null;

    }


    const data =
      JSON.parse(saved);


    if (
      !data.ticket ||
      !data.expiresAt
    ) {

      sessionStorage.removeItem(
        SESSION_KEY
      );

      return null;

    }


    if (
      Date.now() >=
      Number(data.expiresAt)
    ) {

      sessionStorage.removeItem(
        SESSION_KEY
      );

      return null;

    }


    return data;

  }

  catch(error) {

    sessionStorage.removeItem(
      SESSION_KEY
    );

    return null;

  }

}


// =====================================================
// VÉRIFICATION AUTOMATIQUE DE SESSION
// =====================================================

const savedAccess =
  getSavedAccess();


if (savedAccess) {

  window.location.replace(
    SITE_MULTICHAINE
  );

}


// =====================================================
// VÉRIFICATION TICKET
// =====================================================

verifyButton.addEventListener(
  "click",
  verifyTicket
);


ticketInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      verifyTicket();

    }

  }
);


async function verifyTicket() {

  const code =
    ticketInput.value
      .trim()
      .toUpperCase();


  // ---------------------------------------------------
  // CODE VIDE
  // ---------------------------------------------------

  if (!code) {

    showMessage(
      "⚠️ Entrez votre ticket.",
      "error"
    );

    ticketInput.focus();

    return;

  }


  verifyButton.disabled =
    true;

  verifyButton.textContent =
    "Vérification...";


  showLoading(
    "Connexion sécurisée..."
  );


  try {

    // =================================================
    // AUTHENTIFICATION ANONYME
    // =================================================

    const connected =
      await connectFirebase();


    if (!connected) {

      throw new Error(
        "AUTH_FAILED"
      );

    }


    // =================================================
    // RÉFÉRENCE DU TICKET
    // =================================================

    const ticketRef =
      doc(
        db,
        "tickets",
        code
      );


    // =================================================
    // LECTURE
    // =================================================

    showLoading(
      "Vérification de votre ticket..."
    );


    const ticketSnap =
      await getDoc(
        ticketRef
      );


    if (
      !ticketSnap.exists()
    ) {

      throw new Error(
        "TICKET_NOT_FOUND"
      );

    }


    const ticketData =
      ticketSnap.data();


    // =================================================
    // TICKET ACTIF
    // =================================================

    if (
      ticketData.active === false
    ) {

      throw new Error(
        "TICKET_INACTIVE"
      );

    }


    // =================================================
    // TICKET DÉJÀ UTILISÉ PAR QUELQU'UN
    // =================================================

    if (
      ticketData.userId &&
      ticketData.userId !==
        currentUser.uid
    ) {

      throw new Error(
        "TICKET_USED"
      );

    }


    // =================================================
    // DURÉE
    // =================================================

    const durationMinutes =
      Number(
        ticketData.duration || 720
      );


    // =================================================
    // CALCUL EXPIRATION
    // =================================================

    let expiresAt;


    if (
      ticketData.expiresAt &&
      typeof ticketData.expiresAt.toMillis ===
        "function"
    ) {

      expiresAt =
        ticketData.expiresAt.toMillis();

    }

    else if (
      ticketData.linkedAt &&
      typeof ticketData.linkedAt.toMillis ===
        "function"
    ) {

      expiresAt =
        ticketData.linkedAt.toMillis() +
        durationMinutes *
        60 *
        1000;

    }

    else {

      expiresAt =
        Date.now() +
        durationMinutes *
        60 *
        1000;

    }


    // =================================================
    // TICKET EXPIRÉ
    // =================================================

    if (
      Date.now() >=
      expiresAt
    ) {

      throw new Error(
        "TICKET_EXPIRED"
      );

    }


    // =================================================
    // ASSOCIATION DU TICKET
    // =================================================

    showLoading(
      "Activation de votre accès..."
    );


    await runTransaction(
      db,
      async transaction => {

        const freshSnap =
          await transaction.get(
            ticketRef
          );


        if (
          !freshSnap.exists()
        ) {

          throw new Error(
            "TICKET_NOT_FOUND"
          );

        }


        const freshData =
          freshSnap.data();


        if (
          freshData.active === false
        ) {

          throw new Error(
            "TICKET_INACTIVE"
          );

        }


        if (
          freshData.userId &&
          freshData.userId !==
            currentUser.uid
        ) {

          throw new Error(
            "TICKET_USED"
          );

        }


        let finalExpiresAt =
          expiresAt;


        if (
          freshData.expiresAt &&
          typeof freshData.expiresAt.toMillis ===
            "function"
        ) {

          finalExpiresAt =
            freshData.expiresAt.toMillis();

        }


        if (
          Date.now() >=
          finalExpiresAt
        ) {

          throw new Error(
            "TICKET_EXPIRED"
          );

        }


        transaction.update(
          ticketRef,
          {

            userId:
              currentUser.uid,

            used:
              true,

            linkedAt:
              freshData.linkedAt ||
              serverTimestamp(),

            activatedAt:
              serverTimestamp()

          }
        );

      }
    );


    // =================================================
    // ENREGISTREMENT LOCAL
    // =================================================

    sessionStorage.setItem(
      SESSION_KEY,
      JSON.stringify({

        ticket:
          code,

        uid:
          currentUser.uid,

        expiresAt:
          expiresAt

      })
    );


    // =================================================
    // SUCCÈS
    // =================================================

    hideLoading();


    showMessage(
      "✅ Ticket valide ! Ouverture de Channel+...",
      "success"
    );


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          800
        )
    );


    window.location.replace(
      SITE_MULTICHAINE
    );

  }


  catch(error) {

    console.error(
      "Erreur ticket:",
      error
    );


    hideLoading();


    let text =
      "❌ Impossible de vérifier le ticket.";


    if (
      error.message ===
      "AUTH_FAILED"
    ) {

      text =
        "❌ Impossible de connecter Firebase anonymement. Vérifiez que la connexion anonyme est activée.";

    }

    else if (
      error.message ===
      "TICKET_NOT_FOUND"
    ) {

      text =
        "❌ Ce ticket n'existe pas.";

    }

    else if (
      error.message ===
      "TICKET_INACTIVE"
    ) {

      text =
        "❌ Ce ticket est désactivé.";

    }

    else if (
      error.message ===
      "TICKET_USED"
    ) {

      text =
        "❌ Ce ticket est déjà utilisé sur un autre appareil.";

    }

    else if (
      error.message ===
      "TICKET_EXPIRED"
    ) {

      text =
        "❌ Ce ticket est expiré.";

    }

    else if (
      error.code ===
      "permission-denied"
    ) {

      text =
        "❌ Firebase refuse l'accès. Vérifiez les règles Firestore.";

    }

    else if (
      error.code ===
      "auth/operation-not-allowed"
    ) {

      text =
        "❌ L'authentification anonyme n'est pas activée dans Firebase.";

    }


    showMessage(
      text,
      "error"
    );

  }


  finally {

    verifyButton.disabled =
      false;

    verifyButton.textContent =
      "🔐 Vérifier mon ticket";

  }

}


// =====================================================
// AUTH STATE
// =====================================================

onAuthStateChanged(
  auth,
  user => {

    if (user) {

      currentUser =
        user;

    }

  }
);

</script>

</body>

</html>
