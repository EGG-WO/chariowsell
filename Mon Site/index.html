<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès par ticket</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      background: #1f1f1f;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,.5);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #00b894;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      min-height: 24px;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>🎫 Entrer votre ticket</h2>

    <input
      id="ticketInput"
      type="text"
      placeholder="ABCD-1234-EFGH"
    >

    <button id="btnVerifier">
      Vérifier
    </button>

    <p id="message"></p>

  </div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // Configuration Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDPh3dJ37auy21L70Mekm_ikuIfeD8wCZU",
      authDomain: "channelplus-8c219.firebaseapp.com",
      projectId: "channelplus-8c219",
      storageBucket: "channelplus-8c219.firebasestorage.app",
      messagingSenderId: "178858225057",
      appId: "1:178858225057:web:63c327bf23eb877f196fe0"
    };


    // Initialisation Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    // Vérification du ticket
    async function verifierTicket() {

      const btn = document.getElementById("btnVerifier");
      const message = document.getElementById("message");

      const code = document
        .getElementById("ticketInput")
        .value
        .trim()
        .toUpperCase();


      // Ticket vide
      if (!code) {
        message.textContent = "⚠️ Entrez un ticket";
        return;
      }


      try {

        btn.disabled = true;
        btn.textContent = "Vérification...";


        // Recherche dans Firestore
        const ref = doc(db, "tickets", code);
        message.textContent = "🔄 Recherche du ticket...";
console.log("Code saisi :", code);
        const snap = await getDoc(ref);


        if (snap.exists()) {

          // Ticket trouvé
          message.textContent = "✅ Accès autorisé";


          // Sauvegarde locale
          localStorage.setItem("ticketActif", code);


          // Redirection vers ton site
          setTimeout(() => {

            window.location.href =
              "https://egg-wo.github.io/chariowsell/Mon Site/site-multichaine.html";

          }, 500);

        } else {

          // Ticket introuvable
          message.textContent = "❌ Ticket introuvable";
        }

      } catch (err) {

        console.error(err);

        message.textContent = "❌ Erreur : " + err.message;

      } finally {

        btn.disabled = false;
        btn.textContent = "Vérifier";
      }
    }


    // Bouton Vérifier
    document
      .getElementById("btnVerifier")
      .addEventListener("click", verifierTicket);


    // Touche Entrée
    document
      .getElementById("ticketInput")
      .addEventListener("keydown", (e) => {

        if (e.key === "Enter") {
          verifierTicket();
        }
      });

  </script>

</body>
</html>
