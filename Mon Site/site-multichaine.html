// ----- Cookies -----
function setCookie(name, value, days = 30) {
  const d = new Date();
  d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);

  document.cookie =
    `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/`;
}

function getCookie(name) {
  const cname = name + '=';
  const ca = document.cookie.split(';');

  for (let c of ca) {
    c = c.trim();

    if (c.indexOf(cname) === 0) {
      return decodeURIComponent(c.substring(cname.length));
    }
  }

  return null;
}

// ----- Sauvegarde du ticket -----

  localStorage.setItem('ticketActif', code);
  setCookie('ticketActif', code, 30);

// ----- Récupération du ticket -----
function recupererTicket() {

  // 1. localStorage
  let code = localStorage.getItem('ticketActif');

  // 2. cookie
  if (!code) {
    code = getCookie('ticketActif');

    if (code) {
      localStorage.setItem('ticketActif', code);
    }
  }

  return code;
}
