<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Channel+ Premium - Marvel Streaming</title>

<link rel="dns-prefetch" href="//vidsrc.cc">
<link rel="preconnect" href="https://vidsrc.cc" crossorigin>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#050816;color:#fff;min-height:100vh}

header{
    background:#0f172a;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
    position:sticky;
    top:0;
    z-index:10
}

header h1{color:#22d3ee;font-size:2rem;margin-bottom:5px}
.live{color:#22d3ee;font-weight:bold}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 20px
}

.player-box{
    background:#000;
    border-radius:24px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 40px rgba(0,0,0,.45)
}

#embedFrame{
    width:100%;
    aspect-ratio:16/9;
    display:block;
    border:0;
    background:#000
}

#search{
    width:100%;
    padding:14px 18px;
    margin-top:24px;
    border:0;
    border-radius:16px;
    background:#111827;
    color:#fff;
    font-size:1rem;
    outline:none;
    border: 1px solid rgba(255,255,255,.05);
}

#search:focus{border-color:#22d3ee}

.channels{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px
}

.channel{
    background:rgba(15,23,42,.75);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:22px;
    text-align:center;
    transition:.25s;
    backdrop-filter:blur(12px);
    display:flex;
    flex-direction:column;
    justify-content:between;
}

.channel:hover{
    transform:translateY(-6px);
    box-shadow:0 14px 28px rgba(0,0,0,.3);
    border-color:#22d3ee;
}

.channel img{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    margin-bottom:16px;
    border-radius:16px;
    background:#0b1220;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.08);
}

.channel h3{
    margin-bottom:10px;
    color:#e2e8f0;
    font-size:1rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.channel .meta{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#94a3b8;
    margin-bottom:14px;
}

.channel .rating{color:#fbbf24;font-weight:bold}

.channel button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#22d3ee,#2563eb);
    color:#fff;
    font-weight:bold;
    cursor:pointer
}

footer{text-align:center;padding:30px;color:#94a3b8}

.chat-box{
    margin-top:30px;
    background:rgba(15,23,42,.85);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:20px
}

.chat-box h3{color:#22d3ee;margin-bottom:15px}

.messages{
    height:200px;
    overflow-y:auto;
    background:#0b1220;
    border-radius:16px;
    padding:12px;
    margin-bottom:12px
}

.message{
    margin-bottom:10px;
    padding:8px 10px;
    border-radius:12px;
    background:#111827;
    font-size:14px;
}

.message strong{color:#22d3ee}

.chat-input{display:flex;gap:8px;flex-wrap:wrap}

.chat-input input{
    flex:1;
    min-width:120px;
    padding:10px 12px;
    border:0;
    border-radius:12px;
    background:#111827;
    color:#fff;
    outline:none;
}

.chat-input button{
    padding:10px 16px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#22d3ee,#2563eb);
    color:#fff;
    font-weight:bold;
    cursor:pointer
}

#securityGate{
    position:fixed;
    inset:0;
    background:#050816;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99999;
    text-align:center;
    font-size:1.2rem;
}

@media(max-width:600px){
    header h1{font-size:1.4rem}
    .container{padding:0 12px}
    .channels{grid-template-columns:repeat(2,1fr);gap:12px}
    .channel{padding:12px}
    #search{font-size:16px}
    #embedFrame{border-radius:18px}
}
</style>
</head>
<body>

<div id="securityGate">
    <div>🔐 Initialisation de votre espace cinéma Marvel...</div>
</div>

<div id="protectedContent" style="display:none">

<header>
    <h1>CHANNEL+ PREMIUM</h1>
    <p class="live">🎬 CLONE NETFLIX - SAGA MARVEL UNIVERSE</p>
</header>

<div class="container">

    <div class="player-box">
        <iframe
            id="embedFrame"
            src=""
            allow="autoplay; fullscreen"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>

    <div class="chat-box">
        <h3 id="chatTitle">💬 Chat Univers Marvel</h3>
        <div id="messages" class="messages">
            <div class="message"><strong>Système :</strong> Bienvenue sur votre catalogue Marvel privé !</div>
        </div>
        <div class="chat-input">
            <input id="username" placeholder="Ton pseudo" value="FanMarvel">
            <input id="messageInput" placeholder="Écrire un commentaire...">
            <button id="sendBtn" onclick="envoyerMessage()">Envoyer</button>
        </div>
    </div>

    <input id="search" placeholder="Rechercher un film Marvel dans la liste...">

    <div class="channels" id="channels">
        <!-- Rempli instantanément par le script local -->
    </div>

</div>

<footer>
    <p>© 2026 Channel+ Premium - Base de données Marvel intégrée</p>
</footer>

</div>
<script>
    const tousLesFilms = [
        {"id": 1726, "title": "Iron Man", "poster": "https://tmdb.org", "annee": "2008", "note": "7.6"},
        {"id": 10138, "title": "Iron Man 2", "poster": "https://tmdb.org", "annee": "2010", "note": "6.8"},
        {"id": 10195, "title": "Thor", "poster": "https://tmdb.org", "annee": "2011", "note": "6.8"},
        {"id": 1771, "title": "Captain America", "poster": "https://tmdb.org", "annee": "2011", "note": "7.0"},
        {"id": 24428, "title": "Avengers", "poster": "https://tmdb.org", "annee": "2012", "note": "7.7"},
        {"id": 68721, "title": "Iron Man 3", "poster": "https://tmdb.org", "annee": "2013", "note": "6.9"},
        {"id": 76338, "title": "Thor : Le Monde des ténèbres", "poster": "https://tmdb.org", "annee": "2013", "note": "6.5"},
        {"id": 100402, "title": "Captain America : Le Soldat de l'hiver", "poster": "https://tmdb.org", "annee": "2014", "note": "7.7"},
        {"id": 118340, "title": "Les Gardiens de la Galaxie", "poster": "https://tmdb.org", "annee": "2014", "note": "7.9"},
        {"id": 99861, "title": "Avengers : L'Ère d'Ultron", "poster": "https://tmdb.org", "annee": "2015", "note": "7.3"}
    ];

    const box = document.getElementById("channels");
    const player = document.getElementById("embedFrame");
    const searchInput = document.getElementById("search");

    setTimeout(() => {
        document.getElementById("securityGate").style.display = "none";
        document.getElementById("protectedContent").style.display = "block";
        
        player.src = `https://vidsrc.cc`;
        
        afficherFilms(tousLesFilms);
    }, 1000);

    function afficherFilms(liste) {
        box.innerHTML = "";
        if(liste.length === 0) {
            box.innerHTML = "<p style='color:#94a3b8; grid-column:1/-1;'>Aucun film ne correspond à votre recherche.</p>";
            return;
        }

        liste.forEach(movie => {
            const card = document.createElement("div");
            card.className = "channel";

            card.innerHTML = `
                <img src="${movie.poster}" alt="${movie.title}">
                <h3>${movie.title}</h3>
                <div class="meta">
                    <span>📅 ${movie.annee}</span>
                    <span class="rating">⭐ ${movie.note}</span>
                </div>
                <button onclick="lireFilm('${movie.title.replace(/'/g, "\\'")}', '${movie.id}')">▶ Regarder</button>
            `;
            box.appendChild(card);
        });
    }

    function lireFilm(titreOriginal, idTMDB) {
        player.src = `https://vidsrc.cc{idTMDB}?poster=true`;
        document.getElementById("chatTitle").innerHTML = `💬 Chat : ${titreOriginal}`;
        window.scrollTo({ top:0, behavior:'smooth' });
    }

    searchInput.addEventListener("input", (e) => {
        const recherche = e.target.value.toLowerCase();
        const resultats = tousLesFilms.filter(m => m.title.toLowerCase().includes(recherche));
        afficherFilms(resultats);
    });

    function envoyerMessage() {
        const pseudo = document.getElementById("username").value || "Anonyme";
        const input = document.getElementById("messageInput");
        const msgArea = document.getElementById("messages");

        if(input.value.trim() === "") return;

        const div = document.createElement("div");
        div.className = "message";
        div.innerHTML = `<strong>${pseudo} :</strong> ${input.value}`;
        msgArea.appendChild(div);
        
        input.value = "";
        msgArea.scrollTop = msgArea.scrollHeight; 
    }

    document.getElementById("messageInput").addEventListener("keypress", (e) => {
        if(e.key === "Enter") envoyerMessage();
    });
</script>
</body>
</html>
