*{

body{

.container{

.player-box{

}

.channels{

  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

.channel{
  background:rgba(15,23,42,.75);

  border-radius:22px;

.channel:hover{

.channel img{

  border-radius:24px;
  background:#0b1220;
  padding:10px;
  box-shadow:0 8px 20px rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.08);
  transition:all .3s ease

.channel:hover img{

}

.channel h3{
  margin-bottom:16px;
  color:#e2e8f0;
  font-size:1rem
}

.channel button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#22d3ee,#2563eb);
  color:#fff;
  font-weight:bold;
  cursor:pointer

.channel button:hover{
  opacity:.9

footer{
  text-align:center;
  padding:30px;
  color:#94a3b8

.chat-box{
  margin-top:30px;
  background:rgba(15,23,42,.85);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;

.chat-box h3{

  color:#22d3ee

.messages{
  height:250px;
  overflow-y:auto;
  background:#0b1220;
  border-radius:16px;
  padding:12px;
  margin-bottom:12px
}

.message{
  margin-bottom:10px;
  padding:8px 10px;
  border-radius:12px;
  background:#111827

.message strong{
  color:#22d3ee
}

.chat-input{
  display:flex;

.chat-input input{

  min-width:120px;

.chat-input button{

  background:#050816;
  color:#fff;

  align-items:center;
  justify-content:center;
  z-index:99999;

@media(max-width:600px){
  header h1{
    font-size:1.4rem

  }
}

@media(min-width:601px) and (max-width:1024px){
  .channels{
    grid-template-columns:repeat(2,1fr)
  }
}

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDPh3dJ37uy21L70Mekm_ikuIfeD8wCZU",

  authDomain:
    "channelplus-8c219.firebaseapp.com",

  projectId:
    "channelplus-8c219",

  storageBucket:
    "channelplus-8c219.firebasestorage.app",

  messagingSenderId:
    "178858225057",

  appId:
    "1:178858225057:web:63c327bf23eb877f196fe0"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const SESSION_KEY =
  "channelplus_session";


let accessTicket = null;

let hls = null;

let currentChannel = "Général";

let chatUnsubscribe = null;


/* =========================
   REFUS D'ACCÈS
========================= */

function deny(){

  document.getElementById(
    "securityGate"
  ).innerHTML =

  `
  <div>
    <h2 style="color:#ef4444">
      ⛔ Accès refusé
    </h2>

    <p>
      Ouvrez ce service depuis la page de contrôle du ticket.
    </p>
  </div>
  `;

  try{

    window.parent.postMessage(
      {
        type:"CHANNELPLUS_ACCESS_DENIED"
      },
      window.location.origin
    );

  }catch(e){}

}


/* =========================
   SESSION
========================= */

function validateSession(code){

  try{

    const raw =
      sessionStorage.getItem(SESSION_KEY);

    if(!raw)
      return false;

    const data =
      JSON.parse(raw);

    return (
      data.ticket === code &&
      Date.now() - Number(data.at)
      < 12 * 60 * 60 * 1000
    );

  }catch(e){

    return false;

  }

}


/* =========================
   TICKET FIREBASE
========================= */

async function validateTicket(code){

  const snap =
    await getDoc(
      doc(db,"tickets",code)
    );

  if(!snap.exists())
    return false;

  const data =
    snap.data();

  if(
    data.expiresAt &&
    typeof data.expiresAt.toMillis === "function" &&
    data.expiresAt.toMillis() < Date.now()
  ){

    return false;

  }

  return true;

}


/* =========================
   AUTORISATION
========================= */

async function authorize(){

  const params =
    new URLSearchParams(location.search);

  if(params.toString()){

    history.replaceState(
      null,
      "",
      location.pathname
    );

  }


  return new Promise(resolve => {

    const timer =
      setTimeout(
        () => resolve(false),
        8000
      );


    function receive(e){

      if(
        e.origin !==
        window.location.origin
      )
        return;


      if(
        e.data?.type !==
        "CHANNELPLUS_ACCESS"
      )
        return;


      const code =
        String(
          e.data.ticket || ""
        )
        .trim()
        .toUpperCase();


      if(!code)
        return;


      validateTicket(code)

      .then(ok => {

        if(
          ok &&
          validateSession(code)
        ){

          accessTicket = code;

          sessionStorage.setItem(
            SESSION_KEY,
            JSON.stringify({
              ticket:code,
              at:Date.now()
            })
          );

          clearTimeout(timer);

          window.removeEventListener(
            "message",
            receive
          );

          resolve(true);

        }else{

          clearTimeout(timer);

          window.removeEventListener(
            "message",
            receive
          );

          resolve(false);

        }

      })

      .catch(() => {

        clearTimeout(timer);

        window.removeEventListener(
          "message",
          receive
        );

        resolve(false);

      });

    }


    window.addEventListener(
      "message",
      receive
    );

  });

}


/* =========================
   AUTORISATION PRINCIPALE
========================= */

const authorized =
  await authorize();


if(!authorized){

  deny();

}else{

  document.getElementById(
    "securityGate"
  ).style.display = "none";


  document.getElementById(
    "protectedContent"
  ).style.display = "block";


  const video =
    document.getElementById("video");

  const status =
    document.getElementById(
      "playerStatus"
    );


  /* =========================
     LECTEUR HLS
  ========================= */

  window.playChannel =
    function(url){

      if(!url){

        status.textContent =
          "❌ Aucun flux HLS configuré";

        status.className =
          "player-status error";

        return;

      }


      if(hls){

        hls.destroy();

        hls = null;

      }


      video.removeAttribute("src");

      status.className =
        "player-status";

      status.textContent =
        "⏳ Chargement du direct...";


      if(Hls.isSupported()){

        hls = new Hls({

          enableWorker:true,

          lowLatencyMode:true

        });


        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(
          Hls.Events.MANIFEST_PARSED,
          () => {

            status.textContent =
              "🟢 Direct chargé";

            video.play()
              .catch(() => {});

          }
        );


        hls.on(
          Hls.Events.ERROR,
          (event,data) => {

            console.error(
              "Erreur HLS:",
              data
            );


            if(!data.fatal)
              return;


            let message =
              "❌ Erreur HLS";


            if(
              data.type ===
              Hls.ErrorTypes.NETWORK_ERROR
            ){

              message =
                "❌ Erreur réseau / CORS / serveur";

            }


            else if(
              data.type ===
              Hls.ErrorTypes.MEDIA_ERROR
            ){

              message =
                "❌ Erreur du média HLS";

            }


            status.textContent =
              message;

            status.className =
              "player-status error";

          }
        );


      }

      else if(
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ){

        video.src = url;

        video.addEventListener(
          "loadedmetadata",
          () => {

            status.textContent =
              "🟢 Direct chargé";

            video.play()
              .catch(() => {});

          },
          {once:true}
        );


      }

      else{

        status.textContent =
          "❌ Ce navigateur ne supporte pas HLS";

        status.className =
          "player-status error";

      }

    };


  /* =========================
     BOUTON REGARDER
  ========================= */

  window.regarder =
    function(button){

      const card =
        button.closest(".channel");

      if(!card)
        return;


      const url =
        card.dataset.hls;


      const name =
        card.querySelector("h3")
        ?.textContent
        || "Chaîne";


      currentChannel = name;

      document.getElementById(
        "chatTitle"
      ).textContent =
        "💬 Chat • " + name;


      playChannel(url);


      document.querySelector(
        ".player-box"
      ).scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    };


  /* =========================
     CHAT
  ========================= */

  window.ouvrirChat =
    function(channelName){

      currentChannel =
        channelName;


      document.getElementById(
        "chatTitle"
      ).textContent =
        "💬 Chat • " +
        channelName;


      if(chatUnsubscribe)
        chatUnsubscribe();


      const q =
        query(
          collection(
            db,
            "chats",
            currentChannel,
            "messages"
          ),
          orderBy(
            "createdAt",
            "asc"
          )
        );


      chatUnsubscribe =
        onSnapshot(
          q,
          snapshot => {

            const box =
              document.getElementById(
                "messages"
              );


            box.innerHTML = "";


            snapshot.forEach(d => {

              const data =
                d.data();


              const div =
                document.createElement(
                  "div"
                );

              div.className =
                "message";


              const strong =
                document.createElement(
                  "strong"
                );


              strong.textContent =
                (data.user ||
                "Anonyme") + ":";


              div.appendChild(
                strong
              );


              div.appendChild(
                document.createTextNode(
                  " " +
                  (data.text || "")
                )
              );


              box.appendChild(div);

            });


            box.scrollTop =
              box.scrollHeight;

          }
        );

    };


  /* =========================
     ENVOI CHAT
  ========================= */

  document.getElementById(
    "sendBtn"
  ).addEventListener(
    "click",
    async () => {

      const text =
        document.getElementById(
          "messageInput"
        )
        .value
        .trim();


      const user =
        document.getElementById(
          "username"
        )
        .value
        .trim()
        ||
        "Anonyme";


      if(!text)
        return;


      await addDoc(
        collection(
          db,
          "chats",
          currentChannel,
          "messages"
        ),
        {
          user,
          text,
          createdAt:
            serverTimestamp()
        }
      );


      document.getElementById(
        "messageInput"
      ).value = "";

    }
  );


  /* =========================
     RECHERCHE
  ========================= */

  document.getElementById(
    "search"
  ).addEventListener(
    "input",
    e => {

      const q =
        e.target.value
        .toLowerCase();


      document
        .querySelectorAll(
          ".channel"
        )
        .forEach(card => {

          const name =
            card.querySelector(
              "h3"
            )
            .textContent
            .toLowerCase();


          card.style.display =
            name.includes(q)
            ? "block"
            : "none";

        });

    }
  );


  /* =========================
     CHAT GÉNÉRAL
  ========================= */

  ouvrirChat("Général");


  /* =========================
     SURVEILLANCE DU TICKET
  ========================= */

  setInterval(
    async () => {

      if(
        accessTicket &&
        !(await validateTicket(
          accessTicket
        ))
      ){

        if(hls){

          hls.destroy();

          hls = null;

        }

        video.pause();

        deny();

      }

    },
    30000
  );

}

</script>
