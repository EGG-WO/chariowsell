<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel+ Premium HD</title>
    <link rel="dns-prefetch" href="//livewatch.top">
    <link rel="preconnect" href="https://livewatch.top" crossorigin>
    <!-- Framework CSS et Décodeur Vidéo -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #08080a; color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(18, 18, 24, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f0f13; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <!-- ÉCRAN DE CHARGEMENT SÉCURISÉ -->
    <div id="securityGate" class="fixed inset-0 bg-[#08080a] z-50 flex flex-col items-center justify-center gap-3">
        <div class="w-8 h-8 border-2 border-zinc-700 border-t-cyan-500 rounded-full animate-spin"></div>
        <div class="text-sm font-semibold tracking-wider text-zinc-400 uppercase">Vérification de l'accès sécurisé...</div>
    </div>

    <div id="protectedContent" style="display:none" class="flex-1 flex flex-col">
        <!-- BARRE DE NAVIGATION -->
        <header class="bg-zinc-950/80 backdrop-blur-md border-b border-zinc-900 sticky top-0 z-40 px-6 py-4">
            <div class="container mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <span class="text-2xl font-black tracking-tighter text-white">CHANNEL<span class="text-cyan-400">+</span> <span class="text-xs bg-cyan-950 text-cyan-400 font-bold px-2 py-0.5 rounded border border-cyan-800 ml-1 uppercase tracking-widest">Premium</span></span>
                    <span class="flex items-center gap-1.5 text-xs font-bold text-red-500 bg-red-950/40 px-2.5 py-1 rounded-full border border-red-900/30">
                        <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span> EN DIRECT
                    </span>
                </div>
                <!-- BARRE DE RECHERCHE -->
                <div class="w-full sm:w-80">
                    <input type="text" id="search" placeholder="Rechercher une chaîne..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-cyan-500 transition-all">
                </div>
            </div>
        </header>
        <!-- ZONE DE LECTURE ET CHAT -->
        <div class="container mx-auto px-4 py-6 flex-1 flex flex-col gap-6 max-w-7xl">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-stretch">
                
                <!-- L'ÉCRAN DE TÉLÉVISION -->
                <div class="lg:col-span-2 bg-black rounded-2xl border border-zinc-900 overflow-hidden shadow-2xl relative aspect-video bg-zinc-950">
                    <div id="media-container" class="w-full h-full absolute inset-0">
                        <video id="video" class="w-full h-full object-contain" controls autoplay muted playsinline></video>
                    </div>
                </div>

                <!-- LA BOÎTE DE CHAT -->
                <div class="glass-card rounded-2xl p-4 flex flex-col h-[320px] lg:h-auto shadow-2xl">
                    <div class="flex items-center justify-between pb-3 border-b border-zinc-900 shrink-0">
                        <h3 id="chatTitle" class="text-sm font-bold text-zinc-200 flex items-center gap-2">💬 Chat Général</h3>
                    </div>
                    <div id="messages" class="flex-1 overflow-y-auto my-3 pr-1 text-xs space-y-2.5 custom-scrollbar"></div>
                    <div class="space-y-2 shrink-0">
                        <div class="flex gap-2">
                            <input id="username" placeholder="Pseudo" class="w-1/3 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                            <input id="messageInput" placeholder="Message..." class="w-2/3 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                        </div>
                        <button id="sendBtn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold py-2 rounded-xl text-xs tracking-wide cursor-pointer">Envoyer</button>
                    </div>
                </div>

            </div>
            <!-- BOUQUET DE CHAÎNES -->
            <div class="mt-4">
                <h3 class="text-lg font-bold tracking-tight text-zinc-300 mb-4">📺 Bouquet de Chaînes inclus</h3>
                <div id="channels" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                    
                    <div class="glass-card rounded-2xl p-3 flex flex-col justify-between hover:border-zinc-700 transition-all group cursor-pointer" data-name="nollywood tv">
                        <div class="aspect-video bg-zinc-950 rounded-xl flex items-center justify-center p-3 mb-3 border border-zinc-900 overflow-hidden"><img src="nolly.png" class="max-h-full max-w-full object-contain" onerror="this.src='https://placehold.co'"></div>
                        <h4 class="text-xs font-bold text-zinc-300 text-center truncate mb-3">Nollywood TV</h4>
                        <button onclick="ouvrirSource('https://livewatch.top', 'Nollywood TV')" class="w-full bg-zinc-900 hover:bg-cyan-500 text-zinc-200 text-[11px] font-bold py-2 rounded-xl transition-colors cursor-pointer">Visionner</button>
                    </div>

                    <div class="glass-card rounded-2xl p-3 flex flex-col justify-between hover:border-zinc-700 transition-all group cursor-pointer" data-name="disney junior">
                        <div class="aspect-video bg-zinc-950 rounded-xl flex items-center justify-center p-3 mb-3 border border-zinc-900 overflow-hidden"><img src="disney.png" class="max-h-full max-w-full object-contain" onerror="this.src='https://placehold.co'"></div>
                        <h4 class="text-xs font-bold text-zinc-300 text-center truncate mb-3">Disney Junior</h4>
                        <button onclick="ouvrirSource('https://livewatch.top', 'Disney Junior')" class="w-full bg-zinc-900 hover:bg-cyan-500 text-zinc-200 text-[11px] font-bold py-2 rounded-xl transition-colors cursor-pointer">Visionner</button>
                    </div>

                    <div class="glass-card rounded-2xl p-3 flex flex-col justify-between hover:border-zinc-700 transition-all group cursor-pointer" data-name="nickelodeon">
                        <div class="aspect-video bg-zinc-950 rounded-xl flex items-center justify-center p-3 mb-3 border border-zinc-900 overflow-hidden"><img src="nik.png" class="max-h-full max-w-full object-contain" onerror="this.src='https://placehold.co'"></div>
                        <h4 class="text-xs font-bold text-zinc-300 text-center truncate mb-3">Nickelodeon</h4>
                        <button onclick="ouvrirSource('https://livewatch.top', 'Nickelodeon')" class="w-full bg-zinc-900 hover:bg-cyan-500 text-zinc-200 text-[11px] font-bold py-2 rounded-xl transition-colors cursor-pointer">Visionner</button>
                    </div>

                    <div class="glass-card rounded-2xl p-3 flex flex-col justify-between hover:border-zinc-700 transition-all group cursor-pointer" data-name="a+">
                        <div class="aspect-video bg-zinc-950 rounded-xl flex items-center justify-center p-3 mb-3 border border-zinc-900 overflow-hidden"><img src="A+.jpg" class="max-h-full max-w-full object-contain" onerror="this.src='https://placehold.co'"></div>
                        <h4 class="text-xs font-bold text-zinc-300 text-center truncate mb-3">A+</h4>
                        <button onclick="ouvrirSource('https://livewatch.top', 'A+')" class="w-full bg-zinc-900 hover:bg-cyan-500 text-zinc-200 text-[11px] font-bold py-2 rounded-xl transition-colors cursor-pointer">Visionner</button>
                    </div>

                    <div class="glass-card rounded-2xl p-3 flex flex-col justify-between hover:border-zinc-700 transition-all group cursor-pointer" data-name="novelas tv">
                        <div class="aspect-video bg-zinc-950 rounded-xl flex items-center justify-center p-3 mb-3 border border-zinc-900 overflow-hidden"><img src="nov.png" class="max-h-full max-w-full object-contain" onerror="this.src='https://placehold.co'"></div>
                        <h4 class="text-xs font-bold text-zinc-300 text-center truncate mb-3">Novelas TV</h4>
                        <button onclick="ouvrirSource('https://livewatch.top', 'Novelas TV')" class="w-full bg-zinc-900 hover:bg-cyan-500 text-zinc-200 text-[11px] font-bold py-2 rounded-xl transition-colors cursor-pointer">Visionner</button>
                    </div>

                    <div class="glass-card rounded-2xl p-3 flex flex-col justify-between hover:border-zinc-700 transition-all group cursor-pointer" data-name="canal+ sport 1">
                        <div class="aspect-video bg-zinc-950 rounded-xl flex items-center justify-center p-3 mb-3 border border-zinc-900 overflow-hidden"><img src="c+1.png" class="max-h-full max-w-full object-contain" onerror="this.src='https://placehold.co'"></div>
                        <h4 class="text-xs font-bold text-zinc-300 text-center truncate mb-3">Canal+ Sport 1</h4>
                        <button onclick="ouvrirSource('https://livewatch.top', 'Canal+ Sport 1')" class="w-full bg-zinc-900 hover:bg-cyan-500 text-zinc-200 text-[11px] font-bold py-2 rounded-xl transition-colors cursor-pointer">Visionner</button>
                    </div>

                </div>
            </div>
        </div>

        <footer class="bg-zinc-950/40 border-t border-zinc-900 py-6 text-center text-xs text-zinc-500 mt-auto">
            © 2026 Channel+ Premium — Solution IPTV. Tous droits réservés.
        </footer>
    </div>
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://gstatic.com";

        // Identifiants Firebase originaux préservés
        const firebaseConfig = { 
            apiKey: "AIzaSyDPh3dJ37uy21L70Mekm_ikuIfeD8wCZU", 
            authDomain: "://firebaseapp.com", 
            projectId: "channelplus-8c219", 
            storageBucket: "channelplus-8c219.firebasestorage.app", 
            messagingSenderId: "178858225057", 
            appId: "1:178858225057:web:63c327bf23eb877f196fe0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let hlsInstance = null;
        let currentChannel = "Général";
        let chatUnsubscribe = null;
        // Commutateur de flux intelligent (Détecte si c'est un lien embed ou un flux direct)
        window.ouvrirSource = function(srcUrl, channelName) {
            ouvrirChat(channelName);
            const mediaContainer = document.getElementById('media-container');
            
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            if (srcUrl.includes('/embed/') || !srcUrl.match(/\.(m3u8|mp4)/i)) {
                mediaContainer.innerHTML = `<iframe src="${srcUrl}" class="w-full h-full border-0 absolute inset-0 bg-black" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
            } else {
                mediaContainer.innerHTML = `<video id="video" class="w-full h-full object-contain" controls autoplay playsinline></video>`;
                const videoElement = document.getElementById('video');

                if (Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(srcUrl);
                    hlsInstance.attachMedia(videoElement);
                } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                    videoElement.src = srcUrl;
                }
            }
        };

        // Écouteur en direct du chat Firestore
        window.ouvrirChat = function(channelName) {
            currentChannel = channelName;
            document.getElementById("chatTitle").textContent = `💬 Chat : ${channelName}`;
            if (chatUnsubscribe) chatUnsubscribe();
            
            const messagesContainer = document.getElementById("messages");
            messagesContainer.innerHTML = "";

            const q = query(collection(db, "chats", channelName, "messages"), orderBy("timestamp", "asc"));
            chatUnsubscribe = onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const msgData = change.doc.data();
                        const msgDiv = document.createElement("div");
                        msgDiv.className = "bg-zinc-900/80 p-2 rounded-xl text-zinc-300 border border-zinc-800/50";
                        msgDiv.innerHTML = `<strong class="text-cyan-400">${msgData.user || 'Anonyme'} :</strong> ${msgData.text || ''}`;
                        messagesContainer.appendChild(msgDiv);
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }
                });
            });
        };

        // Envoi de messages
        document.getElementById("sendBtn").addEventListener("click", async () => {
            const userField = document.getElementById("username").value.trim() || "Utilisateur";
            const inputField = document.getElementById("messageInput");
            const textValue = inputField.value.trim();

            if (!textValue) return;
            try {
                await addDoc(collection(db, "chats", currentChannel, "messages"), {
                    user: userField,
                    text: textValue,
                    timestamp: serverTimestamp()
                });
                inputField.value = "";
            } catch (err) { console.error(err); }
        });

        // Moteur de tri de la barre de recherche en temps réel
        document.getElementById("search").addEventListener("input", (e) => {
            const searchWord = e.target.value.toLowerCase().trim();
            document.querySelectorAll("#channels > div").forEach(card => {
                const name = card.getAttribute("data-name") || "";
                card.style.display = name.includes(searchWord) ? "flex" : "none";
            });
        });

        // Déblocage automatique initial du sas
        setTimeout(() => {
            document.getElementById("securityGate").style.display = "none";
            document.getElementById("protectedContent").style.display = "flex";
            ouvrirSource('https://livewatch.top', 'Nollywood TV');
        }, 800);
    </script>
</body>
</html>
