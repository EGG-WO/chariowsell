<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Channel+ Premium - Marvel Streaming</title>

<link rel="dns-prefetch" href="//vidsrc.cc">
<link rel="preconnect" href="https://vidsrc.cc" crossorigin>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#050816;color:#fff;min-height:100vh}

header{
    background:#0f172a;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
    position:sticky;
    top:0;
    z-index:10
}

header h1{color:#22d3ee;font-size:2rem;margin-bottom:5px}
.live{color:#22d3ee;font-weight:bold}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 20px
}

.player-box{
    background:#000;
    border-radius:24px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 40px rgba(0,0,0,.45)
}

#embedFrame{
    width:100%;
    aspect-ratio:16/9;
    display:block;
    border:0;
    background:#000
}

#playerLoading{
    display:none;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    align-items:center;
    justify-content:center;
    color:#94a3b8;
    font-size:1rem
}

#search{
    width:100%;
    padding:14px 18px;
    margin-top:24px;
    border:0;
    border-radius:16px;
    background:#111827;
    color:#fff;
    font-size:1rem;
    outline:none;
    border: 1px solid rgba(255,255,255,.05);
}

#search:focus{border-color:#22d3ee}

.channels{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px
}

.channel{
    background:rgba(15,23,42,.75);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:22px;
    text-align:center;
    transition:.25s;
    backdrop-filter:blur(12px);
    display:flex;
    flex-direction:column;
    justify-content:between;
}

.channel:hover{
    transform:translateY(-6px);
    box-shadow:0 14px 28px rgba(0,0,0,.3);
    border-color:#22d3ee;
}

.channel img{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    margin-bottom:16px;
    border-radius:16px;
    background:#0b1220;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.08);
    transition:all .3s ease
}

.channel:hover img{transform:scale(1.03)}

.channel h3{
    margin-bottom:10px;
    color:#e2e8f0;
    font-size:1rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.channel .meta{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#94a3b8;
    margin-bottom:14px;
}

.channel .rating{color:#fbbf24;font-weight:bold}

.channel button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#22d3ee,#2563eb);
    color:#fff;
    font-weight:bold;
    cursor:pointer
}

footer{text-align:center;padding:30px;color:#94a3b8}

.chat-box{
    margin-top:30px;
    background:rgba(15,23,42,.85);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:20px
}

.chat-box h3{color:#22d3ee;margin-bottom:15px}

.messages{
    height:200px;
    overflow-y:auto;
    background:#0b1220;
    border-radius:16px;
    padding:12px;
    margin-bottom:12px
}

.message{
    margin-bottom:10px;
    padding:8px 10px;
    border-radius:12px;
    background:#111827;
    font-size:14px;
}

.message strong{color:#22d3ee}

.chat-input{display:flex;gap:8px;flex-wrap:wrap}

.chat-input input{
    flex:1;
    min-width:120px;
    padding:10px 12px;
    border:0;
    border-radius:12px;
    background:#111827;
    color:#fff;
    outline:none;
}

.chat-input button{
    padding:10px 16px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#22d3ee,#2563eb);
    color:#fff;
    font-weight:bold;
    cursor:pointer
}

#securityGate{
    position:fixed;
    inset:0;
    background:#050816;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99999;
    text-align:center;
    font-size:1.2rem;
}

@media(max-width:600px){
    header h1{font-size:1.4rem}
    .container{padding:0 12px}
    .channels{grid-template-columns:repeat(2,1fr);gap:12px}
    .channel{padding:12px}
    #search{font-size:16px}
    #embedFrame{border-radius:18px}
}
</style>
</head>
<body>

<div id="securityGate">
    <div>🔐 Vérification de l'accès au catalogue...</div>
</div>

<div id="protectedContent" style="display:none">

<header>
    <h1>CHANNEL+ PREMIUM</h1>
    <p class="live">🎬 CLONE NETFLIX - SAGA MARVEL UNIVERSE</p>
</header>

<div class="container">

    <div class="player-box">
        <iframe
            id="embedFrame"
            src=""
            allow="autoplay; fullscreen"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>

    <div class="chat-box">
        <h3 id="chatTitle">💬 Chat Univers Marvel</h3>
        <div id="messages" class="messages">
            <div class="message"><strong>Système :</strong> Bienvenue sur votre plateforme Marvel privée !</div>
        </div>
        <div class="chat-input">
            <input id="username" placeholder="Ton pseudo" value="FanMarvel">
            <input id="messageInput" placeholder="Écrire un commentaire...">
            <button id="sendBtn" onclick="envoyerMessage()">Envoyer</button>
        </div>
    </div>

    <input id="search" placeholder="Rechercher un film Marvel...">

    <div class="channels" id="channels">
        <!-- Chargé par l'API TMDB -->
    </div>

</div>

<footer>
    <p>© 2026 Channel+ Premium - Moteur indépendant autonome</p>
</footer>

</div>
<script>
    // ====================================================================
    // CONFIGURATION : VOTRE CLÉ API COURTE (32 CARACTÈRES) EXTRAITE ET INJECTÉE
    // ====================================================================
    const TMDB_KEY = "95b5eb01d6332e6214402fcb9c18830a"; 
    const MCU_COLLECTION_ID = 131296; 

    const box = document.getElementById("channels");
    const player = document.getElementById("embedFrame");
    const searchInput = document.getElementById("search");
    
    let tousLesFilms = []; 

    // Rideau de chargement initial (1,5 seconde)
    setTimeout(() => {
        document.getElementById("securityGate").style.display = "none";
        document.getElementById("protectedContent").style.display = "block";
        chargerCatalogueTMDB();
    }, 1500);

    // Connexion directe et dynamique à l'infrastructure de TMDB
    function chargerCatalogueTMDB() {
        // CORRECTION DE L'URL : Utilisation du sous-domaine 'api.' obligatoire pour les requêtes
        fetch(`https://themoviedb.org{MCU_COLLECTION_ID}?api_key=${TMDB_KEY}&language=fr-FR`)
            .then(res => {
                if(!res.ok) throw new Error("Réponse réseau incorrecte ou clé refusée");
                return res.json();
            })
            .then(data => {
                // Filtrer les films pour ne garder que ceux qui ont une date de sortie
                tousLesFilms = data.parts.filter(m => m.release_date);
                
                // Tri chronologique du plus ancien au plus récent
                tousLesFilms.sort((a, b) => new Date(a.release_date) - new Date(b.release_date));

                // Lancement automatique du premier film de la liste (Iron Man) par défaut au démarrage
                if(tousLesFilms.length > 0) {
                    player.src = `https://vidsrc.cc{tousLesFilms[0].id}?poster=true`;
                    document.getElementById("chatTitle").innerHTML = `💬 Chat : ${tousLesFilms[0].title}`;
                }
                
                // Génération visuelle de la grille
                afficherFilms(tousLesFilms);
            })
            .catch(err => {
                console.error("Erreur de liaison TMDB :", err);
                box.innerHTML = "<p style='color:#ef4444; grid-column:1/-1;'>⚠️ Impossible de charger le catalogue depuis l'API TMDB. Vérifiez votre connexion internet ou la validité de la clé v3.</p>";
            });
    }

    function afficherFilms(liste) {
        box.innerHTML = "";
        if(liste.length === 0) {
            box.innerHTML = "<p style='color:#94a3b8; grid-column:1/-1;'>Aucun film Marvel ne correspond à cette recherche.</p>";
            return;
        }

        liste.forEach(movie => {
            const card = document.createElement("div");
            card.className = "channel";

            // CORRECTION DE L'IMAGE : Utilisation du CDN officiel d'images de TMDB
            const poster = movie.poster_path 
                ? `https://tmdb.org{movie.poster_path}`
                : 'https://placeholder.com';

            const annee = movie.release_date.split("-")[0];
            const note = movie.vote_average ? movie.vote_average.toFixed(1) : "N/A";

            card.innerHTML = `
                <img src="${poster}" alt="${movie.title}">
                <h3>${movie.title}</h3>
                <div class="meta">
                    <span>📅 ${annee}</span>
                    <span class="rating">⭐ ${note}</span>
                </div>
                <button onclick="lireFilm('${movie.title.replace(/'/g, "\\'")}', '${movie.id}')">▶ Regarder</button>
            `;
            box.appendChild(card);
        });
    }

    // Le moteur de streaming universel basé sur l'ID récupéré en direct de TMDB
    function lireFilm(titreOriginal, idTMDB) {
        player.src = `https://vidsrc.cc{idTMDB}?poster=true`;
        document.getElementById("chatTitle").innerHTML = `💬 Chat : ${titreOriginal}`;
        window.scrollTo({ top:0, behavior:'smooth' });
    }

    // Moteur de recherche de texte en temps réel
    searchInput.addEventListener("input", (e) => {
        const recherche = e.target.value.toLowerCase();
        const resultats = tousLesFilms.filter(m => m.title.toLowerCase().includes(recherche));
        afficherFilms(resultats);
    });

    // Gestion du Chat local
    function envoyerMessage() {
        const pseudo = document.getElementById("username").value || "Anonyme";
        const input = document.getElementById("messageInput");
        const msgArea = document.getElementById("messages");

        if(input.value.trim() === "") return;

        const div = document.createElement("div");
        div.className = "message";
        div.innerHTML = `<strong>${pseudo} :</strong> ${input.value}`;
        msgArea.appendChild(div);
        
        input.value = "";
        msgArea.scrollTop = msgArea.scrollHeight; 
    }

    document.getElementById("messageInput").addEventListener("keypress", (e) => {
        if(e.key === "Enter") envoyerMessage();
    });
</script>
</body>
</html>
