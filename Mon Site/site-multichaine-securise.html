<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
collection,
addDoc,
query,
orderBy,
onSnapshot,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyDPh3dJ37uy21L70Mekm_ikuIfeD8wCZU",

authDomain:"channelplus-8c219.firebaseapp.com",

projectId:"channelplus-8c219",

storageBucket:"channelplus-8c219.firebasestorage.app",

messagingSenderId:"178858225057",

appId:"1:178858225057:web:63c327bf23eb877f196fe0"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const SESSION_KEY = "channelplus_session";

let accessTicket = null;

let hls = null;

let currentChannel = "Général";

let chatUnsubscribe = null;


/* =========================
   SECURITE
========================= */

function deny(){

document.getElementById("securityGate").innerHTML =

"<div>" +
"<h2 style='color:#ef4444'>⛔ Accès refusé</h2>" +
"<p>Ouvrez ce service depuis la page de contrôle du ticket.</p>" +
"</div>";

try{

window.parent.postMessage(
{
type:"CHANNELPLUS_ACCESS_DENIED"
},
window.location.origin
);

}catch(e){}

}


function validateSession(code){

try{

const raw =
sessionStorage.getItem(SESSION_KEY);

if(!raw) return false;

const data = JSON.parse(raw);

return data.ticket === code &&
Date.now() - Number(data.at) < 12*60*60*1000;

}catch(e){

return false;

}

}


async function validateTicket(code){

const snap =
await getDoc(
doc(db,"tickets",code)
);

if(!snap.exists())
return false;

const data = snap.data();

if(
data.expiresAt &&
typeof data.expiresAt.toMillis === "function" &&
data.expiresAt.toMillis() < Date.now()
)
return false;

return true;

}


async function authorize(){

const params =
new URLSearchParams(location.search);

if(params.toString()){

history.replaceState(
null,
"",
location.pathname
);

}

return new Promise(resolve => {

const timer =
setTimeout(
()=>resolve(false),
8000
);


function receive(e){

if(e.origin !== window.location.origin)
return;

if(e.data?.type !== "CHANNELPLUS_ACCESS")
return;

const code =
String(e.data.ticket || "")
.trim()
.toUpperCase();

if(!code)
return;


validateTicket(code)

.then(ok => {

if(ok && validateSession(code)){

accessTicket = code;

sessionStorage.setItem(
SESSION_KEY,
JSON.stringify({
ticket:code,
at:Date.now()
})
);

clearTimeout(timer);

window.removeEventListener(
"message",
receive
);

resolve(true);

}else{

clearTimeout(timer);

window.removeEventListener(
"message",
receive
);

resolve(false);

}

})

.catch(()=>{

clearTimeout(timer);

window.removeEventListener(
"message",
receive
);

resolve(false);

});

}


window.addEventListener(
"message",
receive
);

});

}


const authorized =
await authorize();


if(!authorized){

deny();

}else{

document.getElementById(
"securityGate"
).style.display = "none";

document.getElementById(
"protectedContent"
).style.display = "block";


/* =========================
   LECTEUR HLS
========================= */

const video =
document.getElementById("video");

const status =
document.getElementById("playerStatus");


function afficherStatus(message){

status.textContent = message;

}


/*
   Lecture d'une URL HLS

   IMPORTANT :
   l'URL doit être une URL HLS
   accessible depuis le navigateur.
*/

window.ouvrirHLS =
function(url, channelName){

if(!url ||
url.startsWith("URL_HLS_")){

afficherStatus(
"⚠️ URL HLS non configurée pour " +
channelName
);

return;

}


afficherStatus(
"⏳ Connexion à " +
channelName + "..."
);


if(hls){

hls.destroy();

hls = null;

}

video.removeAttribute("src");

video.load();


if(Hls.isSupported()){

hls = new Hls({

enableWorker:true,

lowLatencyMode:false,

backBufferLength:30

});


hls.on(
Hls.Events.MANIFEST_LOADING,
()=>{

afficherStatus(
"⏳ Chargement du flux..."
);

});


hls.on(
Hls.Events.MANIFEST_PARSED,
()=>{

afficherStatus(
"🟢 " +
channelName +
" — DIRECT"
);

video.play().catch(()=>{});

});


hls.on(
Hls.Events.ERROR,
(event,data)=>{

console.error(
"HLS ERROR:",
data
);


if(!data.fatal)
return;


switch(data.type){

case Hls.ErrorTypes.NETWORK_ERROR:

afficherStatus(
"❌ Erreur réseau / CORS / serveur"
);

break;


case Hls.ErrorTypes.MEDIA_ERROR:

afficherStatus(
"❌ Erreur média HLS"
);

break;


default:

afficherStatus(
"❌ Erreur HLS fatale"
);

break;

}

});

hls.loadSource(url);

hls.attachMedia(video);


}else if(
video.canPlayType(
"application/vnd.apple.mpegurl"
)
){

video.src = url;

video.addEventListener(
"loadedmetadata",
()=>{

afficherStatus(
"🟢 " +
channelName +
" — DIRECT"
);

video.play().catch(()=>{});

},
{once:true}
);

}else{

afficherStatus(
"❌ Ce navigateur ne prend pas en charge HLS"
);

}

};


/* =========================
   CHAT
========================= */

window.ouvrirChat =
function(channelName){

currentChannel =
channelName;

document.getElementById(
"chatTitle"
).textContent =
"💬 Chat • " +
channelName;


if(chatUnsubscribe)
chatUnsubscribe();


const q =
query(
collection(
db,
"chats",
currentChannel,
"messages"
),
orderBy(
"createdAt",
"asc"
)
);


chatUnsubscribe =
onSnapshot(
q,
snapshot=>{

const box =
document.getElementById(
"messages"
);

box.innerHTML = "";


snapshot.forEach(d=>{

const data =
d.data();

const div =
document.createElement(
"div"
);

div.className =
"message";


const strong =
document.createElement(
"strong"
);

strong.textContent =
(data.user || "Anonyme") +
":";


div.appendChild(
strong
);

div.appendChild(
document.createTextNode(
" " +
(data.text || "")
)
);

box.appendChild(
div
);

});


box.scrollTop =
box.scrollHeight;

});

};


/* =========================
   ENVOI CHAT
========================= */

document
.getElementById("sendBtn")
.addEventListener(
"click",
async()=>{

const text =
document
.getElementById("messageInput")
.value
.trim();

const user =
document
.getElementById("username")
.value
.trim() ||
"Anonyme";


if(!text)
return;


await addDoc(
collection(
db,
"chats",
currentChannel,
"messages"
),
{

user,
text,
createdAt:
serverTimestamp()

}
);


document
.getElementById(
"messageInput"
)
.value = "";

});


/* =========================
   RECHERCHE
========================= */

document
.getElementById("search")
.addEventListener(
"input",
e=>{

const q =
e.target.value
.toLowerCase();


document
.querySelectorAll(
".channel"
)
.forEach(card=>{

const name =
card
.querySelector("h3")
.textContent
.toLowerCase();

card.style.display =
name.includes(q)
? "block"
: "none";

});

});


window.ouvrirChat(
"Général"
);


/* =========================
   VERIFICATION TICKET
========================= */

setInterval(
async()=>{

if(
accessTicket &&
!(await validateTicket(accessTicket))
){

if(hls){

hls.destroy();

hls = null;

}

video.pause();

video.removeAttribute("src");

video.load();

deny();

}

},
30000
);

}

</script>
