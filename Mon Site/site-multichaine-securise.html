<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#050816;color:#fff;min-height:100vh}

header{
    background:#0f172a;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
    position:sticky;
    top:0;
    z-index:10
}

header h1{color:#22d3ee;font-size:2rem;margin-bottom:5px}
.live{color:#ef4444;font-weight:bold}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 20px
}

/* =========================
   LECTEUR
   ========================= */

.player-box{
    background:#000;
    border-radius:24px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 40px rgba(0,0,0,.45)
}

video{
    width:100%;
    aspect-ratio:16/9;
    display:block;
    background:#000
}

/* Nouveau lecteur pour les embeds */

#embedFrame{
    width:100%;
    aspect-ratio:16/9;
    display:none;
    border:0;
    background:#000
}

#playerLoading{
    display:none;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    align-items:center;
    justify-content:center;
    color:#94a3b8;
    font-size:1rem
}

#search{
    width:100%;
    padding:14px 18px;
    margin-top:24px;
    border:0;
    border-radius:16px;
    background:#111827;
    color:#fff;
    font-size:1rem;
    outline:none
}

.channels{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px
}

.channel{
    background:rgba(15,23,42,.75);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:22px;
    text-align:center;
    transition:.25s;
    backdrop-filter:blur(12px)
}

.channel:hover{
    transform:translateY(-6px);
    box-shadow:0 14px 28px rgba(0,0,0,.3)
}

.channel img{
    width:100%;
    height:120px;
    object-fit:cover;
    margin-bottom:16px;
    border-radius:24px;
    background:#0b1220;
    padding:10px;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.08);
    transition:all .3s ease
}

.channel:hover img{
    transform:scale(1.04);
    box-shadow:0 14px 28px rgba(0,0,0,.45)
}

.channel h3{
    margin-bottom:16px;
    color:#e2e8f0;
    font-size:1rem
}

.channel button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#22d3ee,#2563eb);
    color:#fff;
    font-weight:bold;
    cursor:pointer
}

footer{
    text-align:center;
    padding:30px;
    color:#94a3b8
}

.chat-box{
    margin-top:30px;
    background:rgba(15,23,42,.85);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:20px
}

.chat-box h3{
    margin-bottom:15px;
    color:#22d3ee
}

.messages{
    height:250px;
    overflow-y:auto;
    background:#0b1220;
    border-radius:16px;
    padding:12px;
    margin-bottom:12px
}

.message{
    margin-bottom:10px;
    padding:8px 10px;
    border-radius:12px;
    background:#111827
}

.message strong{color:#22d3ee}

.chat-input{
    display:flex;
    gap:8px;
    flex-wrap:wrap
}

.chat-input input{
    flex:1;
    min-width:120px;
    padding:10px 12px;
    border:0;
    border-radius:12px;
    background:#111827;
    color:#fff
}

.chat-input button{
    padding:10px 16px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#22d3ee,#2563eb);
    color:#fff;
    font-weight:bold;
    cursor:pointer
}

#securityGate{
    position:fixed;
    inset:0;
    background:#050816;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99999;
    text-align:center
}

@media(max-width:600px){
    header h1{font-size:1.4rem}
    .container{padding:0 12px}
    .channels{grid-template-columns:1fr;gap:16px}
    .channel{padding:16px}
    #search{font-size:16px}
    video,#embedFrame,#playerLoading{border-radius:18px}
}

@media(min-width:601px) and (max-width:1024px){
    .channels{grid-template-columns:repeat(2,1fr)}
}
</style>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyDPh3dJ37uy21L70Mekm_ikuIfeD8wCZU",
    authDomain: "channelplus-8c219.firebaseapp.com",
    projectId: "channelplus-8c219",
    storageBucket: "channelplus-8c219.firebasestorage.app",
    messagingSenderId: "178858225057",
    appId: "1:178858225057:web:63c327bf23eb877f196fe0"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const SESSION_KEY = "channelplus_session";

let accessTicket = null;
let hls = null;
let currentChannel = "Général";
let chatUnsubscribe = null;


/* =========================
   SECURITE
   ========================= */

function deny() {

    document.getElementById("securityGate").innerHTML =
        "<div><h2 style='color:#ef4444'>⛔ Accès refusé</h2>" +
        "<p>Ouvrez ce service depuis la page de contrôle du ticket.</p></div>";

    try {

        window.parent.postMessage(
            {type:"CHANNELPLUS_ACCESS_DENIED"},
            window.location.origin
        );

    } catch(e) {}
}


function validateSession(code) {

    try {

        const raw =
            sessionStorage.getItem(SESSION_KEY);

        if (!raw) return false;

        const data =
            JSON.parse(raw);

        return data.ticket === code &&
            Date.now() - Number(data.at) <
            12 * 60 * 60 * 1000;

    } catch(e) {

        return false;

    }
}


async function validateTicket(code) {

    const snap =
        await getDoc(
            doc(db, "tickets", code)
        );

    if (!snap.exists())
        return false;

    const data = snap.data();

    if (
        data.expiresAt &&
        typeof data.expiresAt.toMillis === "function" &&
        data.expiresAt.toMillis() < Date.now()
    )
        return false;

    return true;
}


async function authorize() {

    const params =
        new URLSearchParams(location.search);

    if (params.toString()) {

        history.replaceState(
            null,
            "",
            location.pathname
        );

    }


    return new Promise(resolve => {

        const timer =
            setTimeout(
                () => resolve(false),
                8000
            );


        function receive(e) {

            if (e.origin !== window.location.origin)
                return;

            if (e.data?.type !== "CHANNELPLUS_ACCESS")
                return;


            const code =
                String(
                    e.data.ticket || ""
                )
                .trim()
                .toUpperCase();


            if (!code)
                return;


            validateTicket(code)
                .then(ok => {

                    if (ok && validateSession(code)) {

                        accessTicket = code;

                        sessionStorage.setItem(
                            SESSION_KEY,
                            JSON.stringify({
                                ticket: code,
                                at: Date.now()
                            })
                        );

                        clearTimeout(timer);

                        window.removeEventListener(
                            "message",
                            receive
                        );

                        resolve(true);

                    } else {

                        clearTimeout(timer);

                        window.removeEventListener(
                            "message",
                            receive
                        );

                        resolve(false);

                    }

                })
                .catch(() => {

                    clearTimeout(timer);

                    window.removeEventListener(
                        "message",
                        receive
                    );

                    resolve(false);

                });

        }


        window.addEventListener(
            "message",
            receive
        );

    });
}


const authorized = await authorize();


if (!authorized) {

    deny();

} else {

    document.getElementById(
        "securityGate"
    ).style.display = "none";


    document.getElementById(
        "protectedContent"
    ).style.display = "block";


    const video =
        document.getElementById("video");

    const embedFrame =
        document.getElementById("embedFrame");

    const playerLoading =
        document.getElementById("playerLoading");


    const adn =
        "https://d3b73b34o7cvkq.cloudfront.net/v1/master/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-gz2sgqzp076kf/adn.m3u8";


    /* =========================
       LECTEUR HLS EXISTANT
       ========================= */

    function playChannel(url) {

        /*
        On cache l'iframe
        */

        embedFrame.style.display = "none";
        embedFrame.src = "";

        playerLoading.style.display = "none";

        video.style.display = "block";


        if (hls)
            hls.destroy();


        if (Hls.isSupported()) {

            hls = new Hls();

            hls.loadSource(url);

            hls.attachMedia(video);

            hls.on(
                Hls.Events.MANIFEST_PARSED,
                () => video.play().catch(()=>{})
            );

        } else if (
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            video.src = url;

            video.play().catch(()=>{});

        }

    }


    /*
    ==================================================
    NOUVELLE FONCTION :
    EMBED SUR LA MEME PAGE
    ==================================================
    */

    window.ouvrirEmbed = function(url) {

        /*
        Arrête le lecteur HLS actuel
        */

        if (hls) {

            hls.destroy();
            hls = null;

        }

        video.pause();

        video.removeAttribute("src");

        video.style.display = "none";


        /*
        Affiche le chargement
        */

        embedFrame.style.display = "none";

        playerLoading.style.display = "flex";


        /*
        Charge l'embed dans la page actuelle
        */

        embedFrame.src = url;


        embedFrame.onload = function() {

            playerLoading.style.display = "none";

            embedFrame.style.display = "block";

        };


        /*
        Reste sur la même page
        */

        document.querySelector(
            ".player-box"
        ).scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    };


    /*
    ==================================================
    CHAT  — VERSION CORRIGÉE
    ==================================================
    */

    window.ouvrirChat = function(channelName) {

        currentChannel = channelName;

        document.getElementById(
            "chatTitle"
        ).textContent =
            "💬 Chat • " + channelName;


        if (chatUnsubscribe)
            chatUnsubscribe();


        /*
        Vider la zone avant de re-écouter
        */

        const box =
            document.getElementById(
                "messages"
            );

        box.innerHTML = "";


        const q = query(
            collection(
                db,
                "chats",
                currentChannel,
                "messages"
            ),
            orderBy(
                "createdAt",
                "asc"
            )
        );


        chatUnsubscribe =
            onSnapshot(
                q,
                snapshot => {

                    /*
                    Rendu INCRÉMENTAL :
                    on n'efface plus tout à chaque
                    snapshot, on ajoute seulement
                    les nouveaux messages.
                    */

                    snapshot.docChanges().forEach(
                        change => {

                            if (
                                change.type === "added"
                            ) {

                                const docId =
                                    change.doc.id;

                                /*
                                Éviter les doublons
                                si le snapshot se
                                redéclenche
                                */

                                if (
                                    document.getElementById(
                                        "msg-" + docId
                                    )
                                ) return;


                                const data =
                                    change.doc.data();


                                const div =
                                    document.createElement(
                                        "div"
                                    );

                                div.className =
                                    "message";

                                div.id =
                                    "msg-" + docId;


                                const strong =
                                    document.createElement(
                                        "strong"
                                    );

                                strong.textContent =
                                    (data.user ||
                                    "Anonyme") + ":";


                                div.appendChild(
                                    strong
                                );

                                div.appendChild(
                                    document.createTextNode(
                                        " " +
                                        (data.text || "")
                                    )
                                );


                                box.appendChild(div);

                            }

                        }
                    );


                    box.scrollTop =
                        box.scrollHeight;

                },

                /*
                Gestion d'erreur du listener :
                si Firestore refuse l'accès
                (règles de sécurité), on
                l'affiche clairement.
                */

                error => {

                    console.error(
                        "Chat listen error:",
                        error
                    );

                    box.innerHTML =
                        '<div style="color:#ef4444;text-align:center;padding:20px">' +
                        '⚠️ Impossible de charger le chat.<br>' +
                        'Vérifiez vos règles Firestore pour ' +
                        '<code>chats/{channel}/messages</code>' +
                        '</div>';

                }
            );

    };


    /*
    ==================================================
    ENVOI CHAT  — VERSION CORRIGÉE
    ==================================================
    */

    async function envoyerMessage() {

        const text =
            document
            .getElementById(
                "messageInput"
            )
            .value
            .trim();


        const user =
            document
            .getElementById(
                "username"
            )
            .value
            .trim()
            ||
            "Anonyme";


        if (!text)
            return;


        const btn =
            document.getElementById(
                "sendBtn"
            );

        btn.disabled = true;
        btn.textContent = "...";


        try {

            await addDoc(
                collection(
                    db,
                    "chats",
                    currentChannel,
                    "messages"
                ),
                {
                    user,
                    text,
                    /*
                    Date côté client au lieu
                    de serverTimestamp() :
                    évite le bug où createdAt
                    vaut null pendant que le
                    serveur confirme, ce qui
                    casse l'orderBy et crée
                    des doublons / sauts.
                    */
                    createdAt: new Date()
                }
            );


            document
            .getElementById(
                "messageInput"
            )
            .value = "";

        } catch (err) {

            console.error(
                "Chat send error:",
                err
            );


            const box =
                document.getElementById(
                    "messages"
                );

            const errDiv =
                document.createElement(
                    "div"
                );

            errDiv.style.cssText =
                "color:#ef4444;" +
                "text-align:center;" +
                "padding:8px;" +
                "font-size:0.85rem";

            errDiv.textContent =
                "⚠️ Erreur d'envoi. " +
                "Vérifiez vos règles Firestore.";

            box.appendChild(errDiv);

            setTimeout(
                () => errDiv.remove(),
                4000
            );

        } finally {

            btn.disabled = false;
            btn.textContent = "Envoyer";

        }

    }


    document
        .getElementById("sendBtn")
        .addEventListener(
            "click",
            envoyerMessage
        );


    /*
    Envoi avec la touche Entrée
    */

    document
        .getElementById("messageInput")
        .addEventListener(
            "keydown",
            e => {

                if (e.key === "Enter")
                    envoyerMessage();

            }
        );


    /*
    ==================================================
    RECHERCHE
    ==================================================
    */

    document
        .getElementById("search")
        .addEventListener(
            "input",
            e => {

                const q =
                    e.target.value
                    .toLowerCase();


                document
                    .querySelectorAll(
                        ".channel"
                    )
                    .forEach(card => {

                        const name =
                            card
                            .querySelector("h3")
                            .textContent
                            .toLowerCase();


                        card.style.display =
                            name.includes(q)
                            ? "block"
                            : "none";

                    });

            }
        );


    /*
    ==================================================
    CHAT GENERAL
    ==================================================
    */

    window.ouvrirChat("Général");


    /*
    ==================================================
    LECTEUR INITIAL
    ==================================================
    */

    playChannel(adn);


    /*
    ==================================================
    CONTROLE PERIODIQUE DU TICKET
    ==================================================
    */

    setInterval(
        async () => {

            if (
                accessTicket &&
                !(await validateTicket(
                    accessTicket
                ))
            ) {

                deny();

            }

        },
        30000
    );

}

</script>
