<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Channel+ Premium</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,Helvetica,sans-serif
    }

    body{
      background:#050816;

    }

    header{
      background:#0f172a;
      padding:20px;
      text-align:center;
      position:sticky;

    header h1{
      color:#22d3ee;

      color:#ef4444;

    }

      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;

      text-align:center;
      transition:.25s
    }

    .channel:hover{
      transform:translateY(-6px)
    }

    .channel img{
      width:100%;
      height:120px;
      object-fit:cover;
      border-radius:20px;
      margin-bottom:14px;
      background:#111827
    }

    .channel h3{
      margin-bottom:14px;
      color:#e2e8f0
    }

    .channel button{
      width:100%;
      padding:12px;
      border:0;
      border-radius:14px;
      background:linear-gradient(135deg,#22d3ee,#2563eb);
      color:#fff;
      font-weight:bold;
      cursor:pointer
    }

    footer{
      text-align:center;

      color:#94a3b8
    }

        font-size:1.4rem

<body>

  <header>
    <h1>CHANNEL+ PREMIUM</h1>
    <p class="live">🔴 TV EN DIRECT</p>
  </header>

  <div class="container">

    <div class="player-box">
      <video id="video" controls autoplay muted playsinline></video>
      <iframe id="embedFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <input id="search" placeholder="Rechercher une chaîne..." />

    <div class="channels" id="channels">
      <p style="text-align:center;color:#94a3b8">
        Chargement des chaînes...
      </p>
    </div>

  </div>

  <footer>
    © 2026 Channel+ Premium
  </footer>

  <script>

    // =========================
    // CONFIG API
    // =========================

    const API_TOKEN =
      "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIwNjM1NGExNWExNGNjMjY1NDE1YjBjMjc2ZTYwMWJlMCIsIm5iZiI6MTc4NjMwNDM4Ni4zMjYwMDAyLCJzdWIiOiI2YTc4ZDc4MjRlNDkxZDg5MTVmNTc0MzYiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.JZ43tSYxr-LYBLsJWgVZsABk-3EAAYo2Br4UuhhCTjo";

    const API_URL =
      "https://livewatch.top/api/v1/public/all";


    // =========================
    // LECTEUR
    // =========================

    const video =
      document.getElementById("video");

    const embedFrame =
      document.getElementById("embedFrame");

    let hls = null;


    function playChannel(url){

      embedFrame.style.display = "none";
      embedFrame.src = "";

      video.style.display = "block";

      if(hls) hls.destroy();

      if(Hls.isSupported()){

        hls = new Hls();

        hls.loadSource(url);

        hls.attachMedia(video);

        hls.on(
          Hls.Events.MANIFEST_PARSED,
          () => video.play().catch(()=>{})
        );

      }else{

        video.src = url;

      }

    }


    function ouvrirEmbed(url){

      if(hls){

        hls.destroy();
        hls = null;

      }

      video.pause();

      video.style.display = "none";

      embedFrame.src = url;

      embedFrame.style.display = "block";

      document.querySelector(".player-box")
        .scrollIntoView({
          behavior:"smooth"
        });

    }


    // =========================
    // CHARGEMENT DES CHAINES
    // =========================

    async function chargerChaines(){

      const container =
        document.getElementById("channels");

      try{

        const response = await fetch(API_URL,{
          headers:{
            "Authorization":`Bearer ${API_TOKEN}`,
            "Accept":"application/json"
          }
        });

        const data =
          await response.json();

        const channels =
          Array.isArray(data)
            ? data
            : (data.channels || []);

        container.innerHTML = "";

        channels.forEach(channel => {

          const name =
            channel.name || "Chaîne";

          const logo =
            channel.logo ||
            channel.logo_url ||
            "https://via.placeholder.com/300x120?text=TV";

          const stream =
            channel.embed_url ||
            channel.url ||
            channel.stream_url;

          if(!stream) return;

          const card =
            document.createElement("div");

          card.className = "channel";

          card.innerHTML = `
            <img src="${logo}" alt="${name}">
            <h3>${name}</h3>
            <button>▶ Regarder</button>
          `;

          card.querySelector("button")
            .onclick = () => {

              if(stream.includes("/embed/")){

                ouvrirEmbed(stream);

              }else{

                playChannel(stream);

              }

            };

          container.appendChild(card);

        });

      }catch(err){

        console.error(err);

        container.innerHTML = `
          <p style="text-align:center;color:#ef4444">
            ❌ Impossible de charger les chaînes
          </p>
        `;
      }

    }


    // =========================
    // RECHERCHE
    // =========================

    document
      .getElementById("search")
      .addEventListener("input",e => {

        const q =
          e.target.value.toLowerCase();

        document
          .querySelectorAll(".channel")
          .forEach(card => {

            const name =
              card.querySelector("h3")
                .textContent
                .toLowerCase();

            card.style.display =
              name.includes(q)
                ? "block"
                : "none";

          });

      });


    // =========================
    // DEMARRAGE
    // =========================

    chargerChaines();

  </script>

</body>
</html>
