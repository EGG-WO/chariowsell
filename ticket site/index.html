<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code unique</title>
  <style>
    body{
      background:#111827;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .box{
      background:#1f2937;
      padding:40px;
      border-radius:20px;
      text-align:center;
      width:90%;
      max-width:500px;
    }
    button{
      padding:15px 25px;
      font-size:18px;
      border:none;
      border-radius:12px;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🎫 Obtenir un code unique</h2>
    <p id="status">Connectez-vous avec Google.</p>
    <button id="btn">Se connecter et obtenir un code</button>
  </div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      limit,
      getDocs,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    const firebaseConfig = {

  apiKey: "AIzaSyDPh3dJ37auy21L70Mekm_ikuIfeD8wCZU",

  authDomain: "channelplus-8c219.firebaseapp.com",

  projectId: "channelplus-8c219",

  storageBucket: "channelplus-8c219.firebasestorage.app",

  messagingSenderId: "178858225057",

  appId: "1:178858225057:web:63c327bf23eb877f196fe0"

};


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const btn = document.getElementById("btn");
    const status = document.getElementById("status");

    async function obtenirCode(){

      try{

        btn.disabled = true;
        status.textContent = "🔐 Connexion Google...";

        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);

        const user = result.user;

        // Vérifier si l'utilisateur a déjà un code
        const claimRef = doc(db, "claims", user.uid);
        const claimSnap = await getDoc(claimRef);

        if(claimSnap.exists()){

          localStorage.setItem(
            "myTicket",
            claimSnap.data().code
          );

          window.location.href = "ticket.html";
          return;
        }

        status.textContent = "🔍 Recherche d'un ticket...";

        // Chercher un ticket libre
        const q = query(
          collection(db, "tickets"),
          where("used", "==", false),
          where("active", "==", true),
          limit(1)
        );

        const snap = await getDocs(q);

        if(snap.empty){
          status.textContent = "❌ Aucun ticket disponible";
          btn.disabled = false;
          return;
        }

        const ticketDoc = snap.docs[0];
        const ticket = ticketDoc.data();

        // Marquer le ticket comme utilisé
        await updateDoc(doc(db, "tickets", ticketDoc.id), {
          used: true,
          owner: user.uid,
          claimedAt: serverTimestamp()
        });

        // Enregistrer le claim
        await setDoc(claimRef, {
          code: ticket.code,
          ticketId: ticketDoc.id,
          createdAt: serverTimestamp()
        });

        localStorage.setItem("myTicket", ticket.code);

        window.location.href = "ticket.html";

      }catch(e){

        console.error(e);
        status.textContent = "❌ " + e.message;
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", obtenirCode);

  </script>

</body>
</html>
